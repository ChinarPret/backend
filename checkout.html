<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Chinar Clothing Store</title>
<link rel="icon" href="assets/images/logo/chinar-logo-square.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div id="top-marquee"></div>
<header class="site-header" id="site-header" data-active="shop"></header>

<main>
  <div class="page-hero">
    <div class="container">
      <span class="eyebrow">Almost There</span>
      <h1>Checkout</h1>
    </div>
  </div>

  <section class="section">
    <div class="container" id="checkoutMount"></div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<div id="cart-drawer-mount"></div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/products-data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/main.js"></script>
<script>
(async function initCheckout() {
  await loadProducts();
  const items = Cart.detailedItems();
  const mount = document.getElementById('checkoutMount');

  if (items.length === 0) {
    mount.innerHTML = `
      <div class="empty-state">
        ${ICONS.bag}
        <h3>Your bag is empty</h3>
        <p class="lede center" style="margin:10px auto 24px;">Add something beautiful before checking out.</p>
        <a href="shop.html" class="btn btn-primary">Shop the Collection</a>
      </div>`;
    return;
  }

  const subtotal = Cart.subtotal();
  const shipping = subtotal >= 6000 ? 0 : 250;
  const total = subtotal + shipping;

  mount.innerHTML = `
    <form class="checkout-grid" id="checkoutForm">
      <div>
        <h3 style="margin-bottom:18px;">Shipping Details</h3>
        <div class="form-grid">
          <div class="form-field"><label>Full Name</label><input required name="fullName" placeholder="Ayesha Khan" /></div>
          <div class="form-field"><label>Phone Number</label><input required name="phone" placeholder="03XX XXXXXXX" /></div>
        </div>
        <div class="form-field"><label>Email Address</label><input required type="email" name="email" placeholder="you@example.com" /></div>
        <div class="form-field"><label>Street Address</label><input required name="address" placeholder="House #, Street, Area" /></div>
        <div class="form-grid">
          <div class="form-field"><label>City</label><input required name="city" placeholder="Lahore" /></div>
          <div class="form-field">
            <label>Province</label>
            <select name="province">
              <option>Punjab</option><option>Sindh</option><option>Khyber Pakhtunkhwa</option>
              <option>Balochistan</option><option>Gilgit-Baltistan</option><option>Islamabad Capital Territory</option>
            </select>
          </div>
        </div>
        <div class="form-field"><label>Order Notes (optional) — e.g. stitching instructions</label><textarea name="notes" rows="3" placeholder="Stitch shirt to size Medium, sleeves 3/4..."></textarea></div>

        <h3 style="margin:30px 0 6px;">Payment Method</h3>
        <div class="pay-options" id="payOptions">
          <label class="pay-opt selected"><input type="radio" name="payment" value="cod" checked />${ICONS.cashIcon}<div><div class="pay-name">Cash on Delivery</div><div class="pay-desc">Pay when your order arrives at your doorstep.</div></div></label>

          <label class="pay-opt"><input type="radio" name="payment" value="bank" />${ICONS.bankIcon}<div><div class="pay-name">Bank Transfer</div><div class="pay-desc">Transfer to our account, then place your order.</div></div></label>
          <div id="bankDetailsBox" style="display:none;margin:-6px 0 14px;padding:16px 18px;background:var(--sage-50);border:1px solid var(--sage-200);border-radius:var(--radius-md);">
            <div style="font-size:.82rem;color:var(--ink-soft);margin-bottom:8px;">Transfer the total amount to the account below, then place your order. We'll confirm your payment before dispatch.</div>
            <div style="display:grid;gap:4px;font-size:.9rem;margin-bottom:12px;">
              <div><strong>Bank:</strong> <span data-edit="bank-name">[Add your bank name]</span></div>
              <div><strong>Account Title:</strong> <span data-edit="account-title">Chinar Clothing Store</span></div>
              <div><strong>Account Number:</strong> <span id="bankAcctNumber">0489-79036274-03</span></div>
            </div>
            <button type="button" class="btn btn-outline btn-sm copy-btn" data-copy-target="bankAcctNumber">Copy Account Number</button>
          </div>

          <label class="pay-opt"><input type="radio" name="payment" value="wallet" />${ICONS.walletIcon}<div><div class="pay-name">Mobile Wallet</div><div class="pay-desc">Pay via Easypaisa, JazzCash, or SadaPay.</div></div></label>
          <div id="walletDetailsBox" style="display:none;margin:-6px 0 14px;padding:16px 18px;background:var(--sage-50);border:1px solid var(--sage-200);border-radius:var(--radius-md);">
            <div class="form-field" style="margin-bottom:12px;">
              <label>Choose Wallet</label>
              <select name="walletProvider" id="walletProvider">
                <option value="Easypaisa">Easypaisa</option>
                <option value="JazzCash">JazzCash</option>
                <option value="SadaPay">SadaPay</option>
              </select>
            </div>
            <div style="font-size:.82rem;color:var(--ink-soft);margin-bottom:8px;">Open your <span id="walletNameInline">Easypaisa</span> app and send the total amount to the number below, then place your order.</div>
            <div style="font-size:.9rem;margin-bottom:12px;"><strong>Wallet Number:</strong> <span id="walletNumber" data-edit="wallet-number">+92 3239898913</span></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button type="button" class="btn btn-outline btn-sm copy-btn" data-copy-target="walletNumber">Copy Number</button>
              <a id="walletAppLink" href="https://play.google.com/store/search?q=easypaisa&c=apps" target="_blank" rel="noopener" class="btn btn-outline btn-sm">Don't have the app? Get it</a>
            </div>
          </div>
        </div>

        <button type="submit" id="place-order-btn" class="btn btn-primary btn-block" style="margin-top:10px;">Place Order — ${formatPrice(total)}</button>
      </div>

      <aside class="order-summary">
        <h3 style="margin-bottom:18px;">Order Summary</h3>
        ${items.map(i => `
          <div class="mini-cart-row">
            <img src="${i.product.images[0]}" alt="${i.product.name}" />
            <div style="flex:1;">
              <div style="font-size:.88rem;font-weight:600;">${i.product.name} <span class="qty-badge">${i.qty}</span></div>
              <div style="font-size:.76rem;color:var(--ink-soft);">${i.size}</div>
            </div>
            <div style="font-size:.88rem;">${formatPrice(i.lineTotal)}</div>
          </div>`).join('')}
        <div class="promo-row">
          <input type="text" placeholder="Promo code" id="promoInput" />
          <button type="button" class="btn btn-outline btn-sm" id="promoBtn">Apply</button>
        </div>
        <div class="row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
        <div class="row"><span>Shipping</span><span>${shipping === 0 ? 'Free' : formatPrice(shipping)}</span></div>
        <div class="row total"><span>Total</span><strong>${formatPrice(total)}</strong></div>
      </aside>
    </form>`;

  const WALLET_APP_LINKS = {
    Easypaisa: "https://play.google.com/store/search?q=easypaisa&c=apps",
    JazzCash: "https://play.google.com/store/search?q=jazzcash&c=apps",
    SadaPay: "https://play.google.com/store/search?q=sadapay&c=apps",
  };

  function updatePaymentBoxes() {
    const selected = document.querySelector('input[name="payment"]:checked').value;
    document.getElementById('bankDetailsBox').style.display = selected === 'bank' ? 'block' : 'none';
    document.getElementById('walletDetailsBox').style.display = selected === 'wallet' ? 'block' : 'none';
  }

  function notifyPayment(selected) {
    if (selected === 'bank') {
      showToast('Bank details ready below — transfer the total, then place your order.');
    } else if (selected === 'wallet') {
      const provider = document.getElementById('walletProvider').value;
      showToast(`${provider} number ready below — send the total, then place your order.`);
    }
  }

  document.querySelectorAll('.pay-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.pay-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      opt.querySelector('input').checked = true;
      updatePaymentBoxes();
      notifyPayment(opt.querySelector('input').value);
    });
  });
  updatePaymentBoxes();

  document.getElementById('walletProvider').addEventListener('change', function () {
    document.getElementById('walletNameInline').textContent = this.value;
    document.getElementById('walletAppLink').href = WALLET_APP_LINKS[this.value] || WALLET_APP_LINKS.Easypaisa;
    showToast(`Switched to ${this.value} — number below stays the same.`);
  });

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const target = document.getElementById(btn.dataset.copyTarget);
      const text = target.textContent.trim();
      try {
        await navigator.clipboard.writeText(text);
        showToast('Copied to clipboard.');
      } catch (e) {
        showToast('Could not copy — please copy it manually.');
      }
    });
  });

  document.getElementById('promoBtn').addEventListener('click', () => {
    const code = document.getElementById('promoInput').value.trim().toUpperCase();
    if (code === 'CHINAR10') {
      showToast('Promo applied! 10% off will be confirmed via email.');
    } else if (code) {
      showToast('Invalid promo code');
    }
  });

  // Submit Handler
  document.getElementById('checkoutForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const placeOrderBtn = document.getElementById('place-order-btn');
    placeOrderBtn.innerText = 'Processing Order...';
    placeOrderBtn.disabled = true;

    const fd = new FormData(e.target);
    const orderId = 'CHN-' + Math.floor(100000 + Math.random() * 900000);

    const orderData = {
      customer: Object.fromEntries(fd.entries()),
      items: items.map(i => ({ id: i.id, name: i.product.name, size: i.size, qty: i.qty, unitPrice: i.unitPrice, product: i.product, lineTotal: i.lineTotal })),
      subtotal: subtotal,
      shipping: shipping,
      total: total,
      orderId: orderId,
      placedAt: new Date().toISOString()
    };

    // Paste your Web3Forms access key here:
    const WEB3FORMS_ACCESS_KEY = "5f1fc1ef-0441-467a-a17d-fa39f0ee1e44";

    // 1. Send Order Email via Web3Forms
    await Cart.sendOrderEmail(orderData, WEB3FORMS_ACCESS_KEY);

    // 2. Save the order to the backend so it can be looked up later on the Track Order page
    try {
      await fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      });
    } catch (err) {
      console.error('Could not save order to backend:', err);
    }

    // 3. Save snapshot locally + add to this browser's order history
    localStorage.setItem('chinar_last_order', JSON.stringify(orderData));
    try {
      const history = JSON.parse(localStorage.getItem('chinar_orders_v1')) || [];
      history.unshift({ orderId, phone: orderData.customer.phone || '', placedAt: orderData.placedAt });
      localStorage.setItem('chinar_orders_v1', JSON.stringify(history));
    } catch (e) { /* localStorage unavailable — order is still saved on the server */ }

    // 4. Clear shopping cart
    Cart.clear();

    // 5. Redirect window to order success page
    window.location.href = `order-success.html?id=${orderId}&phone=${encodeURIComponent(orderData.customer.phone || '')}`;
  });
})();
</script>
</body>
</html>
