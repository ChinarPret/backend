<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Orders — Chinar Clothing Store</title>
<link rel="icon" href="assets/images/logo/chinar-logo-square.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div id="top-marquee"></div>
<header class="site-header" id="site-header" data-active=""></header>

<main>
  <div class="page-hero">
    <div class="container">
      <span class="eyebrow">Order History</span>
      <h1>My Orders</h1>
    </div>
  </div>

  <section class="section">
    <div class="wrap-narrow" id="ordersMount">
      <p style="color:var(--ink-soft);font-size:.85rem;">Enter the phone number you used at checkout to see every order placed with it — on any device, not just this browser.</p>

      <form id="lookupForm" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
        <input type="tel" id="lookupPhone" placeholder="e.g. 03XX-XXXXXXX" required
               style="flex:1;min-width:220px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius-md);font-family:inherit;font-size:.9rem;" />
        <button type="submit" class="btn btn-primary" id="lookupBtn">Find My Orders</button>
      </form>
      <p id="lookupMsg" style="color:var(--ink-soft);font-size:.8rem;margin-top:8px;"></p>

      <div id="ordersList" style="margin-top:24px;"></div>

      <p style="color:var(--ink-soft);font-size:.8rem;margin-top:18px;">Know your Order ID already? <a href="track-order.html" style="color:var(--chinar-green-dark);text-decoration:underline;">Track it directly</a> instead.</p>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<div id="cart-drawer-mount"></div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/products-data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function initMyOrders() {
  const listEl = document.getElementById('ordersList');
  const form = document.getElementById('lookupForm');
  const phoneInput = document.getElementById('lookupPhone');
  const lookupBtn = document.getElementById('lookupBtn');
  const msgEl = document.getElementById('lookupMsg');

  function emptyState(message) {
    listEl.innerHTML = `
      <div class="empty-state">
        ${ICONS.packageIcon}
        <h3>No orders found</h3>
        <p class="lede center" style="margin:10px auto 24px;">${message}</p>
        <a href="shop.html" class="btn btn-primary">Shop the Collection</a>
      </div>`;
  }

  function renderOrders(orders) {
    listEl.innerHTML = orders.map(o => `<div class="order-card" data-order-id="${o.orderId}" style="border:1px solid var(--line);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;cursor:pointer;">
        <div>
          <div style="font-weight:600;">${o.orderId}</div>
          <div style="font-size:.78rem;color:var(--ink-soft);">${new Date(o.placedAt).toLocaleDateString('en-PK', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          ${(o.payment === 'bank' || o.payment === 'wallet') ? `<div style="font-size:.78rem;padding:6px 12px;border-radius:20px;background:${o.paymentStatus === 'received' ? 'var(--sage-100)' : '#fbeecb'};color:${o.paymentStatus === 'received' ? 'var(--chinar-green-dark)' : '#8a5a00'};">${o.paymentStatus === 'received' ? 'Payment Received' : 'Payment Pending'}</div>` : ''}
          <div style="font-size:.8rem;padding:6px 12px;border-radius:20px;background:var(--sage-100);color:var(--chinar-green-dark);">${o.currentStage}</div>
        </div>
      </div>`).join('');

    listEl.querySelectorAll('.order-card').forEach(card => {
      const orderId = card.getAttribute('data-order-id');
      card.addEventListener('click', () => {
        location.href = `track-order.html?id=${encodeURIComponent(orderId)}&phone=${encodeURIComponent(phoneInput.value.trim())}`;
      });
    });
  }

  // The real source of truth: ask the server for every order placed with
  // this phone number, so orders show up no matter which device/browser
  // the customer is currently using.
  async function lookupByPhone(phone, { silent } = {}) {
    if (!silent) {
      lookupBtn.disabled = true;
      lookupBtn.textContent = 'Searching...';
      msgEl.textContent = '';
    }
    try {
      const res = await fetch(`/api/orders/lookup?phone=${encodeURIComponent(phone)}`);
      const data = await res.json();
      if (!res.ok) {
        if (!silent) {
          emptyState(data.error || "We couldn't find any orders for that phone number.");
          msgEl.textContent = data.error || '';
        }
        return;
      }
      if (data.length === 0) {
        emptyState("No orders found for that phone number. Double-check the number you used at checkout.");
      } else {
        renderOrders(data);
      }
      try { localStorage.setItem('chinar_last_phone', phone); } catch (e) { /* ignore */ }
    } catch (e) {
      if (!silent) {
        emptyState("Couldn't reach the server to look up your orders. Please check your connection and try again.");
      }
    } finally {
      lookupBtn.disabled = false;
      lookupBtn.textContent = 'Find My Orders';
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const phone = phoneInput.value.trim();
    if (phone) lookupByPhone(phone);
  });

  // Convenience: if we remember the phone from a previous order on this
  // browser, prefill it and auto-run the lookup. This is just a shortcut —
  // the lookup itself always goes to the server, so it works everywhere.
  let rememberedPhone = '';
  try { rememberedPhone = localStorage.getItem('chinar_last_phone') || ''; } catch (e) { /* ignore */ }

  if (rememberedPhone) {
    phoneInput.value = rememberedPhone;
    lookupByPhone(rememberedPhone, { silent: true });
  } else {
    emptyState("Enter your phone number above to find your orders.");
  }
})();
</script>
</body>
</html>
