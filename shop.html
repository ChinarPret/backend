<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop All — Chinar Clothing Store</title>
<link rel="icon" href="assets/images/logo/chinar-logo-square.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div id="top-marquee"></div>
<header class="site-header" id="site-header" data-active="shop"></header>

<main>
  <div class="page-hero">
    <div class="container">
      <span class="eyebrow">The Collection</span>
      <h1 id="pageTitle">Shop All</h1>
      <p id="pageSubtitle">Hand-embroidered, ready-to-wear suits in Small, Medium and Large — made to last.</p>
    </div>
  </div>

  <section class="section" style="padding-top:44px;">
    <div class="container">
      <div class="toolbar">
        <div class="filters" id="filterChips">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="unstitched">Unstitched</button>
          <button class="chip" data-filter="ready-to-wear">Ready to Wear</button>
          <button class="chip" data-filter="sale">On Sale</button>
          <button class="chip" data-filter="new">New Arrivals</button>
        </div>
        <div style="display:flex; gap:14px; align-items:center;">
          <span class="result-count" id="resultCount"></span>
          <select class="sort-select" id="sortSelect">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A–Z</option>
          </select>
        </div>
      </div>
      <div class="product-grid" id="shopGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <h3>No pieces found</h3>
        <p class="lede center" style="margin:8px auto 20px;">Try a different filter or clear your search.</p>
        <a href="shop.html" class="btn btn-outline btn-sm">Reset Filters</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<div id="cart-drawer-mount"></div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/products-data.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/partials.js"></script>
<script src="assets/js/main.js"></script>
<script>
(async function initShop() {
  const products = await loadProducts();
  const params = new URLSearchParams(location.search);
  let activeFilter = params.get('category') || params.get('filter') || (params.get('sale') ? 'sale' : 'all');
  const query = (params.get('q') || '').toLowerCase();
  const wishlistView = params.get('view') === 'wishlist';
  let sortMode = 'featured';

  if (wishlistView) {
    document.getElementById('pageTitle').textContent = 'Your Wishlist';
    document.getElementById('pageSubtitle').textContent = 'Pieces you have saved for later.';
    document.getElementById('filterChips').style.display = 'none';
  } else if (query) {
    document.getElementById('pageTitle').textContent = `Results for "${params.get('q')}"`;
  }

  document.querySelectorAll('.chip').forEach(chip => {
    if (chip.dataset.filter === activeFilter) chip.classList.add('active'); else chip.classList.remove('active');
    chip.addEventListener('click', () => {
      activeFilter = chip.dataset.filter;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      render();
    });
  });

  document.getElementById('sortSelect').addEventListener('change', (e) => {
    sortMode = e.target.value;
    render();
  });

  function applyFilter(list) {
    let out = list;
    if (wishlistView) {
      const ids = Cart.wishRead();
      out = out.filter(p => ids.includes(p.id));
    } else {
      if (activeFilter === 'unstitched') out = out.filter(p => p.category === 'unstitched');
      else if (activeFilter === 'ready-to-wear') out = out.filter(p => p.category === 'ready-to-wear');
      else if (activeFilter === 'sale') out = out.filter(p => p.sale_price);
      else if (activeFilter === 'new') out = out.filter(p => p.badge === 'New Arrival');
    }
    if (query) {
      out = out.filter(p =>
        p.name.toLowerCase().includes(query) ||
        p.color.toLowerCase().includes(query) ||
        p.fabric.toLowerCase().includes(query) ||
        p.collection.toLowerCase().includes(query)
      );
    }
    return out;
  }

  function applySort(list) {
    const out = [...list];
    if (sortMode === 'price-asc') out.sort((a,b) => (a.sale_price||a.price) - (b.sale_price||b.price));
    else if (sortMode === 'price-desc') out.sort((a,b) => (b.sale_price||b.price) - (a.sale_price||a.price));
    else if (sortMode === 'name-asc') out.sort((a,b) => a.name.localeCompare(b.name));
    return out;
  }

  function render() {
    const filtered = applySort(applyFilter(products));
    document.getElementById('resultCount').textContent = `${filtered.length} piece${filtered.length !== 1 ? 's' : ''}`;
    const grid = document.getElementById('shopGrid');
    const empty = document.getElementById('emptyState');
    if (filtered.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      grid.innerHTML = filtered.map(productCardHTML).join('');
    }
  }

  render();
})();
</script>
</body>
</html>
